[package]
name = "silent-threshold-encryption"
version = "0.1.0"
edition = "2021"

[dependencies]
criterion = { version = "0.5.0", features = ["html_reports"] }
blstrs = { version = "0.7", features = ["serde"] }
ff = "0.13"
group = "0.13"
pairing = "0.23"
rand = { version = "0.9.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = { version = "1.10" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ark-std = { version = "0.5.0", features = ["print-trace"] }

[features]
default = []

[profile.dev]
opt-level = 3

[[bench]]
name = "encryption"
harness = false

[[bench]]
name = "decryption"
harness = false

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "setup"
harness = false
